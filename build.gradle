plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.1.1'
group = 'net.mapperzones'
base { archivesName = 'MapperZones' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'info'; mods { mapperzones { source sourceSets.main } } }
        client {}
        server { args '--nogui' }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.26' }
jar { manifest { attributes(['Specification-Title':'mapperzones','Specification-Vendor':'MapperZones','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.jar.archiveVersion]) } }
